<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d25">
<title>QUIZ ARENA 2.0</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at top,#303d83,#090d25 65%);
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding:14px;
}
.container{max-width:650px;margin:auto}
header{text-align:center;padding:15px}
.logo{
 font-size:34px;font-weight:1000;
 color:#ffd166;
 text-shadow:0 0 20px #ffb70066;
}
.logo span{color:#4de3ff}
.tagline{color:#b9c8f5;font-size:12px}
.card{
 background:linear-gradient(145deg,#202b59,#111832);
 border:1px solid #5368a5;
 border-radius:20px;
 padding:20px;
 margin:15px 0;
 box-shadow:0 10px 30px #0005;
}
h2{text-align:center}
button{
 cursor:pointer;
 border:0;
 font-weight:bold;
}
.main{
 width:100%;
 padding:15px;
 border-radius:12px;
 background:linear-gradient(90deg,#ffd166,#ff9f43);
 color:#11152e;
 font-size:17px;
 margin-top:12px;
}
.secondary{
 background:#354477;
 color:white;
 padding:12px;
 border-radius:12px;
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.category{
 padding:16px 5px;
 border-radius:13px;
 background:#293866;
 color:white;
 border:1px solid #5368a5;
}
.category.active{
 background:#8449a5;
 border:2px solid #ffd166;
}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 text-align:center;
}
.stat{
 background:#0b1433;
 padding:12px 5px;
 border-radius:12px;
 color:#ffd166;
 font-weight:bold;
 font-size:13px;
}
.option{
 width:100%;
 padding:15px;
 margin:7px 0;
 background:#293866;
 color:white;
 text-align:left;
 border-radius:12px;
 border:1px solid #6275b2;
 font-size:15px;
}
.option.correct{background:#087b58}
.option.wrong{background:#a72d50}
.option:disabled{opacity:1}
.progress{
 height:9px;
 background:#080d20;
 border-radius:10px;
 margin:15px 0;
}
.bar{
 height:100%;
 background:linear-gradient(90deg,#4de3ff,#ff4f9a);
 width:0%;
 border-radius:10px;
}
.timer{
 text-align:center;
 font-size:30px;
 font-weight:900;
 color:#ffd166;
 margin:10px;
}
.hide{display:none!important}
#question{
 font-size:21px;
 line-height:1.5;
 text-align:center;
}
#feedback{
 text-align:center;
 min-height:25px;
 font-weight:bold;
 color:#ffd166;
}
.result{text-align:center}
.bigscore{
 font-size:50px;
 color:#ffd166;
 font-weight:1000;
}
.rank{
 padding:12px;
 background:#26345f;
 margin:8px 0;
 border-radius:10px;
}
footer{
 text-align:center;
 font-size:12px;
 color:#aab8df;
 padding:20px;
}
</style>
</head>

<body>
<div class="container">

<header>
<div class="logo">🏆 QUIZ <span>ARENA</span></div>
<div class="tagline">THINK FAST • PLAY SMART • WIN BIG</div>
<button class="secondary" onclick="toggleLanguage()" id="lang">
नेपाली / English
</button>
</header>

<!-- HOME -->
<section id="home">

<div class="card">
<h2 id="welcome">🎮 स्वागत छ!</h2>

<div class="stats">
<div class="stat">
⭐ BEST<br><span id="best">0</span>
</div>
<div class="stat">
🏅 LEVEL<br><span id="level">1</span>
</div>
<div class="stat">
💎 TOTAL XP<br><span id="xp">0</span>
</div>
</div>
</div>

<div class="card">
<h3 id="selectTitle">📚 विषय छान्नुहोस्</h3>

<div class="grid" id="categories"></div>

<button class="main" onclick="startGame(false)" id="start">
▶ START GAME
</button>

<button class="main" onclick="startGame(true)">
🎁 DAILY CHALLENGE
</button>

<button class="main" onclick="showLeaderboard()">
🥇 LEADERBOARD
</button>
</div>

</section>

<!-- GAME -->
<section id="game" class="card hide">

<div class="stats">
<div class="stat">QUESTION<br><span id="qnum">1</span></div>
<div class="stat">SCORE<br><span id="score">0</span></div>
<div class="stat">LEVEL<br><span id="gameLevel">1</span></div>
</div>

<div class="timer" id="timer">⏱ 15</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<div id="feedback"></div>

<button class="main hide" id="next" onclick="nextQuestion()">
NEXT ➜
</button>

<button class="secondary" onclick="goHome()">
EXIT GAME
</button>

</section>

<!-- RESULT -->
<section id="result" class="card hide result">

<h1>🏆 GAME OVER!</h1>

<div class="bigscore" id="finalScore">0</div>

<h2 id="resultMessage">Excellent!</h2>

<p id="resultDetails"></p>

<button class="main" onclick="startGame(false)">
🔄 PLAY AGAIN
</button>

<button class="main" onclick="goHome()">
🏠 HOME
</button>

</section>

<!-- LEADERBOARD -->
<section id="leaderboard" class="card hide">

<h2>🥇 TOP 10 LEADERBOARD</h2>

<div id="ranking"></div>

<button class="main" onclick="goHome()">🏠 HOME</button>

</section>

<footer>
Developed by <b>Dilip Rimal</b><br>
QUIZ ARENA VERSION 2.0<br>
Offline Gaming Experience
</footer>

</div>

<script>

// ================= LANGUAGE =================

let language="ne";

function toggleLanguage(){
 language=language==="ne"?"en":"ne";
 document.getElementById("lang").textContent=
 language==="ne"?"नेपाली / English":"English / नेपाली";
 renderCategories();
}

// ================= CATEGORIES =================

const categories=[
 ["all","🌈 सबै विषय","All Categories"],
 ["nepal","🇳🇵 नेपाल GK","Nepal GK"],
 ["science","🔬 विज्ञान","Science"],
 ["geo","🌍 भूगोल","Geography"],
 ["history","📜 इतिहास","History"],
 ["sports","🏏 खेलकुद","Sports"],
 ["tech","💻 प्रविधि","Technology"],
 ["math","➗ गणित","Mathematics"],
 ["lit","📚 साहित्य","Literature"]
];

let selected="all";

function renderCategories(){
 document.getElementById("categories").innerHTML=
 categories.map(c=>`
 <button class="category ${selected===c[0]?'active':''}"
 onclick="selectCategory('${c[0]}')">
 ${language==="ne"?c[1]:c[2]}
 </button>
 `).join("");
}

function selectCategory(id){
 selected=id;
 renderCategories();
}

["nepal","नेपालमा कति प्रदेश छन्?","How many provinces are in Nepal?",["५","६","७","८"],["5","6","7","8"],2],

["nepal","नेपालको राष्ट्रिय पक्षी कुन हो?","What is Nepal's national bird?",["डाँफे","मयूर","चील","काग"],["Danphe","Peacock","Eagle","Crow"],0],

["nepal","लुम्बिनी कुन जिल्लामा पर्छ?","Where is Lumbini located?",["रुपन्देही","पाल्पा","दाङ","कास्की"],["Rupandehi","Palpa","Dang","Kaski"],0],

["science","पानीको रासायनिक सूत्र के हो?","What is water's chemical formula?",["CO2","H2O","O2","NaCl"],["CO2","H2O","O2","NaCl"],1],

["science","रगत पम्प गर्ने अंग कुन हो?","Which organ pumps blood?",["फोक्सो","मुटु","मिर्गौला","कलेजो"],["Lungs","Heart","Kidney","Liver"],1],

["science","सूर्य के हो?","What is the Sun?",["ग्रह","तारा","उपग्रह","धूमकेतु"],["Planet","Star","Satellite","Comet"],1],

["science","बिरुवाले खाना बन
